version: "3.9"

services:

  # Laravel Backend
  backend:
    build: ./backend
    container_name: jam_backend
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_DATABASE: jam_madera
      DB_USERNAME: root
      DB_PASSWORD: root
    networks:
      - jamnet

  # Nginx para Laravel
  nginx:
    build:
      context: ./frontend   # donde está el Dockerfile del React
    container_name: jam_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - jamnet


  # MySQL
  mysql:
    image: mysql:8.0.30
    container_name: jam_mysql
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: jam_madera
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jamnet

  # React Frontend
  frontend:
    build: ./frontend
    container_name: jam_frontend
    networks:
      - jamnet


networks:
  jamnet:

volumes:
  db_data: