# ===== HTTP (redirige a HTTPS + certbot) =====
server {
    listen 80;
    server_name vision.jammaderas.com;

    # 🔐 Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirección a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===== HTTPS =====
server {
    listen 443 ssl;
    server_name vision.jammaderas.com;

    ssl_certificate /etc/letsencrypt/live/vision.jammaderas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vision.jammaderas.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ===== FRONTEND (React SPA) =====
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # ===== BACKEND (Laravel API) =====
    location ~ ^/api(/.*)?$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass jam_backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $1;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        include fastcgi_params;
        fastcgi_pass jam_backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }


    # 🔒 Seguridad
    location ~ /\.(?!well-known) {
        deny all;
    }
}
